name: Deploy

# main에 올라가고 CI가 통과하면 Fly.io로 배포한다. 수동 실행도 가능.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Fly.io 배포
    runs-on: ubuntu-latest
    # CI가 실패했으면 배포하지 않는다 (수동 실행은 그대로 진행)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 마이그레이션은 이미지가 아니라 여기서 돌린다.
      # 운영 이미지에는 prisma CLI 실행 파일이 없고, 배포 전에 스키마를 맞춰야
      # 새 코드가 올라간 순간 바로 동작하기 때문. (대안은 docs/DEPLOY.md 참고)
      - name: 마이그레이션 적용
        run: pnpm --filter @applypad/api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: API 배포
        run: flyctl deploy . --config apps/api/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 웹 배포
        run: flyctl deploy . --config apps/web/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 헬스체크
        run: |
          set -e
          curl -fsS --retry 10 --retry-delay 5 --retry-all-errors \
            https://applypad-api.fly.dev/api/health
          curl -fsS --retry 10 --retry-delay 5 --retry-all-errors \
            -o /dev/null https://applypad-web.fly.dev/
