name: Keep API warm

# Render 무료 인스턴스는 15분 동안 요청이 없으면 멈추고, 다시 깨어나는 데 1분쯤 걸린다.
# 방문이 있을 만한 시간대(한국 09시~24시)에만 10분마다 깨워서 콜드스타트를 피한다.
#
# 하루 15시간 × 31일 = 약 465시간. Render 무료 한도(월 750시간) 안에 들어온다.
# 24시간 내내 깨워두면 744시간이라 한도에 거의 붙으므로 일부러 밤에는 재운다.
#
# 필요 없으면 이 파일을 지우거나 Actions 탭에서 워크플로를 비활성화하면 된다.
# (GitHub은 60일간 커밋이 없는 저장소의 스케줄 워크플로를 자동으로 멈춘다)
on:
  schedule:
    - cron: "*/10 0-14 * * *" # UTC 00:00~14:59 = KST 09:00~23:59
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 헬스체크 호출
        # 깨어나는 중이면 시간이 걸리므로 넉넉히 기다리되, 실패해도 워크플로를 빨갛게 만들지 않는다
        run: |
          curl -fsS --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
            "${{ vars.API_BASE_URL }}/api/health" || echo "깨우기 실패 (다음 주기에 재시도)"
