name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 연달아 푸시하면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  verify:
    name: 린트 · 빌드 · 테스트
    runs-on: ubuntu-latest

    # e2e는 실제 Postgres를 쓴다 (로컬과 동일한 16)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: applypad
          POSTGRES_PASSWORD: applypad
          POSTGRES_DB: applypad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U applypad"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://applypad:applypad@localhost:5432/applypad?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-not-used-in-production
      COOKIE_SECURE: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 버전은 package.json의 packageManager를 따른다

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # postinstall에서 prisma generate까지 돌아간다
      - run: pnpm install --frozen-lockfile

      - name: 린트
        run: pnpm lint

      - name: 빌드
        run: pnpm build

      - name: 단위 테스트
        run: pnpm test

      - name: 마이그레이션 적용
        run: pnpm --filter @applypad/api exec prisma migrate deploy

      - name: e2e 테스트
        run: pnpm --filter @applypad/api test:e2e

  docker:
    name: 도커 이미지 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 배포 전에 두 이미지가 실제로 빌드되는지 확인한다 (푸시는 Fly가 한다)
      - name: API 이미지
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: 웹 이미지
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            API_URL=https://applypad-api.fly.dev
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
