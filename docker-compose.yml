services:
  db:
    image: postgres:16-alpine
    container_name: applypad-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-applypad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-applypad}
      POSTGRES_DB: ${POSTGRES_DB:-applypad}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-applypad}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
